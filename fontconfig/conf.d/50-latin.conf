<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<description>Priorities for Latin fonts</description>

	<!-- ## serif ## -->
	<alias binding="strong">
		<family>serif</family>
		<prefer>
			<family>Times New Roman</family>
			<family>Georgia</family>
			<family>Liberation Serif</family>
			<family>DejaVu Serif</family>
			<family>Noto Serif</family>
		</prefer>
	</alias>

	<!-- ## sans-serif ## -->
	<alias binding="strong">
		<family>sans-serif</family>
		<prefer>
			<family>Arial</family>
			<family>Verdana</family>
			<family>Tahoma</family>
			<family>Lucida Sans Unicode</family>
			<family>Liberation Sans</family>
			<family>DejaVu Sans</family>
			<family>Noto Sans</family>
		</prefer>
	</alias>

	<!-- ## monospace ## -->
	<alias binding="strong">
		<family>monospace</family>
		<prefer>
			<family>CaskaydiaCove Nerd Font Mono</family>
			<family>FiraCode Nerd Font Mono</family>
			<family>Cascadia Code NF</family>
			<family>Noto Sans Mono</family>
		</prefer>
	</alias>

	<!-- ## fantasy ## -->
	<alias binding="strong">
		<family>fantasy</family>
		<prefer>
			<family>Signika</family>
			<family>Impact</family>
			<family>Bauhaus Std</family>
		</prefer>
	</alias>

	<!-- ## cursive ## -->
	<alias binding="strong">
		<family>cursive</family>
		<prefer>
			<family>Tex Gyre Chorus</family>
			<family>Segoe Script</family>
			<family>Chancery URW</family>
			<family>ITC Zapf Chancery Std</family>
			<family>Zapfino</family>
			<family>Segoe Print</family>
			<family>Mistral</family>
			<family>Comic Sans MS</family>
		</prefer>
	</alias>
</fontconfig>
