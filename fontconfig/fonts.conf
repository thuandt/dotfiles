<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<description>User Font configuration</description>
	<match target="font">
		<edit name="antialias" mode="assign">
			<bool>true</bool>
		</edit>
		<edit name="hinting" mode="assign">
			<bool>true</bool>
		</edit>
		<edit name="hintstyle" mode="assign">
			<const>hintslight</const>
		</edit>
		<edit name="rgba" mode="assign">
			<const>rgb</const>
		</edit>
		<edit name="lcdfilter" mode="assign">
			<const>lcddefault</const>
		</edit>
		<edit name="dpi" mode="assign">
			<double>96</double>
		</edit>

		<!-- Only disable embedded bitmaps if the font is NOT a color font (emoji) -->
		<test name="color" compare="not_eq">
			<bool>true</bool>
		</test>
		<edit name="embeddedbitmap" mode="assign">
			<bool>false</bool>
		</edit>
	</match>

	<match target="font">
		<test name="family" compare="eq" ignore-blanks="true">
			<string>Adwaita Sans</string>
		</test>
		<edit name="fontfeatures" mode="append">
			<string>dlig on, tnum on, ccmp on, ss01 on, ss02 on</string>
		</edit>
	</match>

	<match target="font">
		<test name="family" compare="eq" ignore-blanks="true">
			<string>Inter</string>
		</test>
		<edit name="fontfeatures" mode="append">
			<string>dlig on, tnum on, ccmp on, ss01 on, ss02 on</string>
		</edit>
	</match>

	<match target="font">
		<test name="weight" compare="less_eq">
			<const>medium</const>
		</test>
		<test target="pattern" name="weight" compare="more">
			<const>medium</const>
		</test>
		<edit name="embolden" mode="assign">
			<bool>true</bool>
		</edit>
		<edit name="weight" mode="assign">
			<const>bold</const>
		</edit>
	</match>

	<!-- Reject all bitmap (non-scalable) fonts -->
	<selectfont>
		<rejectfont>
			<pattern>
				<patelt name="scalable">
					<bool>false</bool>
				</patelt>
			</pattern>
		</rejectfont>
	</selectfont>

	<selectfont>
		<rejectfont>
			<pattern>
				<patelt name="family">
					<!-- This font is causing problem with GitHub -->
					<string>Nimbus Sans</string>
				</patelt>
			</pattern>
		</rejectfont>
	</selectfont>

</fontconfig>
